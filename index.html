const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function home(){
 clearInterval(tick);$('#calc').style.display='none';
 const old=ld(KS),res=old&&!old.done;
 app.innerHTML=`<div class="w"><div class="c"><h1>СОР · Информатика и ИИ · 7 класс</h1>
 <p class="sm">Время: 40 минут · ${BANK.length} заданий · Максимум: ${BANK.reduce((s,b)=>s+b.p,0)} баллов. Ответы сохраняются автоматически.</p>
 ${res?`<p><b>Найдена незавершённая работа: ${esc(old.name)}.</b></p><button onclick="resume()">Продолжить работу</button> <button class="g" onclick="two(this,()=>{localStorage.removeItem('${KS}');home()})">Начать заново</button><hr>`:''}
 <h3>Ученик</h3><input type="text" id="nm" placeholder="Фамилия и имя"><br><br><input type="text" id="cl" placeholder="Класс (например, 7А)">
 <p class="sm">Правила: работа открывается на весь экран. Переключение вкладок, сворачивание окна или выход из полноэкранного режима фиксируется. После ${MAXV} нарушений работа завершается автоматически. Копирование и правый клик отключены.</p>
 <button onclick="start()">Начать СОР</button></div></div>`;
}
function start(){
 const n=$('#nm').value.trim(),c=$('#cl').value.trim();
 if(n.length<3||!c){alert('Введите фамилию, имя и класс');return}
 S={name:n,cls:c,start:Date.now(),end:Date.now()+DUR,viol:0,done:false,ans:{},
  items:BANK.map((b,i)=>{const vi=Math.random()*b.v.length|0;const v=b.v[vi];return{i,vi,o:v.o?sh(v.o.map((x,j)=>j)):null}})};
 sv(KS,S);run();
}
function resume(){S=ld(KS);S.viol=S.viol;run()}
function fs(){const e=document.documentElement;try{(e.requestFullscreen||e.webkitRequestFullscreen).call(e).catch(()=>{})}catch(x){}}
function run(){
 fs();$('#calc').style.display='block';
 let h=`<div id="bar"><div><b>${esc(S.name)}</b> · ${esc(S.cls)}<div class="sm">Нарушений: <span id="vc">${S.viol}</span> из ${MAXV}</div></div><div id="tm">40:00</div><button onclick="fin1(this)">Завершить работу</button></div><div class="w">`;
 S.items.forEach((it,n)=>{
  const b=BANK[it.i],v=b.v[it.vi],a=S.ans[n]||'';
  h+=`<div class="c"><h3>Задание ${n+1} · ${b.t} · ${b.p} б.</h3><p style="margin:0 0 8px"><b>${esc(v.q)}</b></p>`;
  if(v.g)h+=`<div class="px" style="grid-template-columns:repeat(${v.g[0].length},26px)">${v.g.map(r=>[...r].map(x=>`<i class="${x=='1'?'b':''}"></i>`).join('')).join('')}</div>`;
  if(b.k=='c')h+=it.o.map(j=>`<label class="o"><input type="radio" name="q${n}" value="${j}" ${a===String(j)?'checked':''} onchange="sa(${n},this.value)"> ${esc(v.o[j])}</label>`).join('');
  else h+=`<input type="text" value="${esc(a)}" placeholder="Ваш ответ" oninput="sa(${n},this.value)" autocomplete="off">`;
  h+='</div>';
 });
 app.innerHTML=h+'</div>';
 clearInterval(tick);tick=setInterval(tk,500);tk();
 if(!document.fullscreenElement&&!document.webkitFullscreenElement)setTimeout(()=>{if(S&&!S.done&&!document.fullscreenElement)warn('Не удалось включить полноэкранный режим. Нажмите кнопку ниже.',false)},800);
}
function sa(n,v){S.ans[n]=v;sv(KS,S)}
function tk(){
 const l=S.end-Date.now();if(l<=0){fin();return}
 const m=Math.floor(l/60000),s=Math.floor(l%60000/1000),t=$('#tm');
 t.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');t.className=l<5*60000?'lo':'';
}
function fin1(b){if(b.dataset.s){fin();return}b.dataset.s=1;b.textContent='Точно завершить? Нажмите ещё раз';setTimeout(()=>{b.dataset.s='';b.textContent='Завершить работу'},4000)}
function norm(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'').replace(',','.')}
function check(n){
 const it=S.items[n],b=BANK[it.i],v=b.v[it.vi],a=S.ans[n];
 if(a===undefined||a==='')return 0;
 if(b.k=='c')return Number(a)===v.a?b.p:0;
 if(b.k=='n')return parseFloat(norm(a))===parseFloat(v.a)?b.p:0;
 return norm(a)===norm(v.a)?b.p:0;
}
function fin(){
 if(!S||S.done)return;S.done=true;clearInterval(tk);clearInterval(tick);
 const pts=S.items.map((_,n)=>check(n)),sum=pts.reduce((a,b)=>a+b,0),mx=BANK.reduce((s,b)=>s+b.p,0),pc=Math.round(sum/mx*100);
 const gr=pc>=85?5:pc>=65?4:pc>=40?3:2;
 const r={name:S.name,cls:S.cls,date:new Date().toLocaleString('ru-RU'),sum,mx,pc,gr,viol:S.viol,pts,
  vars:S.items.map(i=>i.vi+1),ans:S.items.map((_,n)=>S.ans[n]||'')};
 LAST=r;const all=ld(KR)||[];all.push(r);sv(KR,all);sv(KS,S);
 try{document.exitFullscreen&&document.exitFullscreen()}catch(e){}
 $('#ov').style.display='none';$('#calc').style.display='none';
 app.innerHTML=`<div class="w"><div class="c"><h1>Работа завершена и сохранена</h1><p>${esc(S.name)}, ${esc(S.cls)}</p>
 <p style="font-size:20px">Баллы: <b>${sum} из ${mx}</b> (${pc}%) · Оценка: <b>${gr}</b></p>
 <p class="sm">Нарушений режима: ${S.viol}. Результат сохраняется в файл на этом компьютере.</p>
 <table><tr><th>№</th><th>Тема</th><th>Балл</th></tr>${pts.map((p,i)=>`<tr><td>${i+1}</td><td>${BANK[i].t}</td><td class="${p?'ok':'no'}">${p}/${BANK[i].p}</td></tr>`).join('')}</table>
 <br><button onclick="saveFile()">Сохранить результат в файл</button> <button class="g" onclick="localStorage.removeItem('${KS}');home()">На главную</button><p class="sm" id="sv">Сохранение файла…</p></div></div>`;setTimeout(saveFile,700);
}
/* ===== Защита от выхода ===== */
function viol(why){
 if(!S||S.done||vlock)return;vlock=true;S.viol++;sv(KS,S);
 const e=$('#vc');if(e)e.textContent=S.viol;
 if(S.viol>=MAXV){warn('Превышен лимит нарушений. Работа завершена.',true);setTimeout(fin,1500);return}
 warn(why+' Нарушение '+S.viol+' из '+MAXV+'. Следующее нарушение может завершить работу.',false);
}
function warn(t,end){$('#op').textContent=t;$('#ov').style.display='flex';$('#ov button').style.display=end?'none':''}
function back(){$('#ov').style.display='none';vlock=false;fs()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)viol('Вы переключили вкладку или свернули окно.')});
window.addEventListener('blur',()=>{if(S&&!S.done&&!document.hidden)setTimeout(()=>{if(!document.hasFocus())viol('Окно теста потеряло фокус (другое окно или приложение).')},300)});
document.addEventListener('fullscreenchange',()=>{if(S&&!S.done&&!document.fullscreenElement&&$('#calc').style.display!=='none')viol('Вы вышли из полноэкранного режима.')});
window.addEventListener('beforeunload',e=>{if(S&&!S.done){e.preventDefault();e.returnValue=''}});
['contextmenu','copy','cut','paste','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(S&&!S.done)e.preventDefault()}));
document.addEventListener('keydown',e=>{if(!S||S.done)return;const k=e.key.toLowerCase();
 if(e.key=='F12'||e.key=='F5'||e.key=='F11'||(e.ctrlKey||e.metaKey)&&['c','v','x','u','s','p','a','t','n','w','r','f'].includes(k)||(e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(k))||e.altKey&&e.key=='Tab')e.preventDefault()});
/* ===== Калькулятор ===== */
const CK=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','^','+','(',')','C','='];
$('#cg').innerHTML=CK.map(k=>`<button class="${/\d|\./.test(k)?'g':''}" onclick="cc('${k}')">${k}</button>`).join('');
function tc(){const p=$('#cp');p.style.display=p.style.display=='block'?'none':'block'}
function cc(k){const i=$('#ci');
 if(k=='C')i.value='';
 else if(k=='='){try{const x=i.value.replace(/\^/g,'**');if(!/^[\d+\-*\/().\s*]+$/.test(x))throw 0;const r=Function('"use strict";return ('+x+')')();i.value=Number.isFinite(r)?+r.toFixed(10):'Ошибка'}catch(e){i.value='Ошибка'}}
 else{if(i.value=='Ошибка')i.value='';i.value+=k}}
/* ===== Сохранение результата в файл ===== */
function saveFile(){
 const r=LAST,m=$('#sv');if(!r)return;const n=BANK.length;
 const h=['Ученик','Класс','Дата','Баллы','Максимум','Процент','Оценка','Нарушений','Варианты'];
 for(let i=1;i<=n;i++)h.push('З'+i+' балл');for(let i=1;i<=n;i++)h.push('З'+i+' ответ');
 const q=x=>'"'+String(x).replace(/"/g,'""')+'"';
 const row=[r.name,r.cls,r.date,r.sum,r.mx,r.pc,r.gr,r.viol,r.vars.join('-')].concat(r.pts,r.ans);
 const csv='\uFEFF'+[h,row].map(x=>x.map(q).join(';')).join('\r\n');
 const fn=('SOR_'+r.cls+'_'+r.name).replace(/[^\wа-яёА-ЯЁ-]+/g,'_')+'.csv';
 const fb=()=>{if(m)m.innerHTML='Файл не сохранён автоматически. Нажмите кнопку «Сохранить результат в файл» или скопируйте текст ниже и покажите учителю:<br><input type="text" readonly value="'+esc(row.join(' | '))+'">'};
 const dl=()=>{try{const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);if(m)m.textContent='Результат сохранён в файл: '+fn+' (папка «Загрузки»)'}catch(e){fb()}};
 const c=window.claude&&claude.use?claude.use('downloads'):Promise.resolve(null);
 c.then(x=>{if(!x){dl();return}return x.save({filename:fn,data:csv}).then(()=>{if(m)m.textContent='Результат сохранён в файл: '+fn}).catch(e=>{if(e&&e.code=='declined')fb();else dl()})}).catch(dl);
}
home();
</script></body></html>
